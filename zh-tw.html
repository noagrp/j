<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobmania Wiki - 繁體中文</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <nav id="main-nav">
            <img src="jobmania_official_icon.png" alt="Jobmania Logo" class="nav-logo">

            <select id="langSelect" onchange="window.location.href=this.value">
                <option value="index.html">🇬🇧 English</option>
                <option value="zh-cn.html">🇨🇳 中文（简体）</option>
                <option value="zh-tw.html" selected>🇹🇼 中文（繁體）</option>
            </select>

            <div class="game-info">
                <strong>Jobmania - Eternal Dungeon</strong><br>
                AUBJECTIVE TECHNOLOGY LTD.<br>
                包含廣告 • 應用程式內購買
            </div>
            <hr>
            <div class="menu-item" onclick="loadView('Home')">🏠 首頁</div>
            <div class="menu-item" onclick="loadView('Monsters')">👹 角色</div>
            <div class="menu-item" onclick="loadView('Jobs')">⚔️ 職業</div>
            <div class="menu-item" onclick="loadView('Abilities')">✨ 技能</div>
            <div class="menu-item" onclick="loadView('Passives')">🛡️ 被動技能</div>
            <div class="menu-item" onclick="loadView('Materials')">🧱 材料</div>
            <div class="menu-item" onclick="loadView('Relic')">💍 遺物系統</div>
            <hr>
            <a href="https://play.google.com/store/apps/details?id=com.aubjective.jobmania&hl=zh-TW" target="_blank" class="menu-link">▶️ Google Play</a>
            <a href="https://discord.gg/6U5FNFVrwb" target="_blank" class="menu-link">💬 加入 Discord</a>
        </nav>
        <main id="content"><h1>正在載入 Wiki 資料...</h1></main>
    </div>

    <script>
        window.JOBMANIA_LOCALE = 'zh-TW';
        window.JOBMANIA_UI = {
            home: '首頁', characters: '角色', jobs: '職業', abilities: '技能', passives: '被動技能', materials: '材料', relicSystem: '遺物系統',
            search: '搜尋...', entries: '條目', loading: '正在載入資料...', error: '錯誤', refresh: '請重新整理頁面。', back: '返回',

            combineList: '合成列表', job: '職業', craftedJob: '合成職業', craftingPath: '合成路線', craftsInto: '可合成為',
            enemySkillPools: '敵人技能池', randomPassives: '隨機被動技能', randomAbilities: '隨機技能', thresholdAbilities: '閾值技能', specialCaseAbilities: '特殊條件技能',

            Rarity: '稀有度', Difficulty: '難度', 'Ability Tier': '技能等級', 'Skill Rank': '技能等級'

    <script src="script.js"></script>
    <script src="job-media.js"></script>
