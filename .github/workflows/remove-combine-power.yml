name: Remove Combine Power from jobs JSON

on:
  push:
    paths:
      - '.github/workflows/remove-combine-power.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove Combine Power
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/jobs.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          count = 0
          for job in data:
              if 'Combine Power' in job:
                  del job['Combine Power']
                  count += 1
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Removed Combine Power from {count} job records')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-combine-power.yml
          git add data/jobs.json
          git commit -m "Remove Combine Power from jobs data"
          git push
